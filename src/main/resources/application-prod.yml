spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Defaults to validate (safe: fails fast on schema drift instead of silently
      # altering prod tables). The very first deploy has no schema yet, so validate
      # fails immediately — override with env var DDL_AUTO=update for that one
      # deploy only, then remove it (see DEPLOY.md).
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false

storage:
  # Defaults to s3. Override with STORAGE_TYPE=local to run before S3 credentials
  # are set up — see DEPLOY.md for why that's a demo-only, data-loses-on-redeploy option.
  type: ${STORAGE_TYPE:s3}
  local:
    # Only relevant when STORAGE_TYPE=local. base-url must be the container's public
    # domain (not the localhost default) or generated image URLs won't resolve.
    base-dir: ${STORAGE_LOCAL_BASE_DIR:./uploads}
    base-url: ${STORAGE_LOCAL_BASE_URL:http://localhost:8080/uploads}
  s3:
    bucket: ${STORAGE_S3_BUCKET}
    region: ${STORAGE_S3_REGION}
    access-key: ${STORAGE_S3_ACCESS_KEY}
    secret-key: ${STORAGE_S3_SECRET_KEY}
    public-url-prefix: ${STORAGE_S3_PUBLIC_URL_PREFIX:}

cors:
  # No default — prod must set the real frontend origin(s) explicitly.
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: warn
    com.example.app: info
