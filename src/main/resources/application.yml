spring:
  application:
    name: aca-used-goods
  profiles:
    active: local
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 210MB

jwt:
  secret: ${JWT_SECRET:7NDBdL9Qu4rOhQhDG2eA58RWw2mkbyG09pSOaER68XurUlF5xcAfgGusXEAlOXPej1uY8OwBu5G+WF7sWKeGjg==}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}

cors:
  # local/test default to the frontend dev servers; prod overrides this in
  # application-prod.yml with no default, so a missing env var fails fast on boot.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

# Infra-facing health probe (Railway healthcheck etc). GET /api/health stays as-is
# for the frontend/Swagger — this is a separate, deliberately minimal endpoint.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
