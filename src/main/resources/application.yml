spring:
  application:
    name: aca-used-goods
  profiles:
    active: local
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jpa:
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:local-dev-only-jwt-secret-key-please-change-0000}
  expiration: ${JWT_EXPIRATION:3600000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json
